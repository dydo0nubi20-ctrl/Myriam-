workflows:
  android-workflow:
    name: SetRize Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: |
          mkdir -p android
          flutter create --platforms=android --org com.setrize --project-name setrize .

      - name: Set minSdkVersion to 23
        script: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "android/app/build.gradle.kts" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi
          sed -i.bak -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 23/' "$GRADLE_FILE"
          sed -i.bak -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 23/' "$GRADLE_FILE"
          rm -f "$GRADLE_FILE.bak"

      - name: Copy Android permissions
        script: |
          cp platform_reference/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install packages
        script: |
          flutter pub get

      - name: Patch Android Gradle config
        script: |
          PLUGIN_GRADLE=$(find $HOME/.pub-cache -path "*get_thumbnail_video*/android/build.gradle" | head -n 1)
          echo "Found: $PLUGIN_GRADLE"
          if [ -n "$PLUGIN_GRADLE" ]; then
            sed -i.bak "/apply plugin: 'kotlin-android'/d" "$PLUGIN_GRADLE"
            sed -i.bak "/id 'kotlin-android'/d" "$PLUGIN_GRADLE"
            sed -i.bak "/id(\"kotlin-android\")/d" "$PLUGIN_GRADLE"
            cat "$PLUGIN_GRADLE"
          else
            echo "WARNING: get_thumbnail_video not found in pub-cache"
          fi
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties
          cat android/gradle.properties

      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=APP_ENV=dev \
            --dart-define=DISABLE_DEMO_MODE=false
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
