workflows:
  android-workflow:
    name: SetRize Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        UPLOAD_ENDPOINT: "https://api.your-backend.example.com/v1/posts/media"
    scripts:
      - name: Generate native Android project
        script: |
          mkdir -p android
          flutter create --platforms=android --org com.setrize --project-name setrize .
      - name: Set minSdkVersion to 23
        script: |
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 23/' android/app/build.gradle
      - name: Copy Android permissions
        script: |
          cp platform_reference/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install packages
        script: |
          flutter pub get
      - name: Generate Freezed/Drift code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=APP_ENV=dev \
            --dart-define=DISABLE_DEMO_MODE=false
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
