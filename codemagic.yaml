workflows:
  android-workflow:
    name: SetRize Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate native Android project
        script: |
          flutter create --platforms=android --org com.setrize .
      - name: Copy real Android permissions
        script: |
          cp platform_reference/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate Freezed/Drift code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
