workflows:
  android-workflow:
    name: SetRize Android
    max_build_duration: 60
    environment:
      # Flutter 3.29.0 — the narrow window that satisfies ALL dependencies:
      #   - image_picker (needs Dart 3.6.0+) ✅
      #   - pro_video_editor (needs Flutter 3.29.0+) ✅
      #   - get_thumbnail_video (breaks on AGP 9+, needs AGP 8.x) ✅
      # Flutter 3.27.0 → pro_video_editor fails
      # Flutter 3.32+   → AGP 9.x, get_thumbnail_video fails
      flutter: 3.29.0
    scripts:
      - name: Generate Android project
        script: |
          mkdir -p android
          flutter create --platforms=android --org com.setrize --project-name setrize .
      - name: Set minSdkVersion to 23
        script: |
          perl -i -pe 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          perl -i -pe 's/minSdkVersion\s+\d+/minSdkVersion 23/g' android/app/build.gradle
          perl -i -pe 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          perl -i -pe 's/minSdk\s*=\s*\d+/minSdk = 23/g' android/app/build.gradle.kts
      - name: Copy Android permissions
        script: |
          cp platform_reference/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install packages
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=APP_ENV=dev \
            --dart-define=DISABLE_DEMO_MODE=false
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
